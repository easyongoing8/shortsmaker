<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 쇼츠 제작 스튜디오</title>
<style>
  :root { --primary: #ff0050; --bg: #0f1015; --card: #1a1c23; --border: #2d3139; --text: #f1f3f5; --sub: #909296; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
  .container { max-width: 1300px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
  header h1 { font-size: 22px; color: #fff; }
  header h1 span { color: var(--primary); }
  .layout { display: grid; grid-template-columns: 420px 1fr; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 6px; }
  input, textarea { width: 100%; padding: 10px; background: #121318; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 13px; margin-bottom: 12px; }
  button { cursor: pointer; border: none; border-radius: 6px; font-weight: 600; }
  .btn-submit { width: 100%; background: var(--primary); color: #fff; padding: 14px; font-size: 15px; }
  .btn-tab { background: #20232a; color: var(--sub); border: 1px solid var(--border); padding: 8px 14px; margin-right: 6px; }
  .btn-tab.active { background: var(--primary); color: #fff; }
  .phone-mockup { width: 300px; height: 530px; background: #000; border-radius: 28px; border: 6px solid #2d3139; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 12px; }
  .phone-top { text-align: center; }
  .t1 { font-size: 15px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.6); display: inline-block; padding: 2px 8px; border-radius: 4px; }
  .t2 { font-size: 18px; font-weight: 900; color: #ffe066; background: rgba(0,0,0,0.6); display: inline-block; padding: 2px 8px; border-radius: 4px; margin-top: 4px; }
  .phone-center { text-align: center; background: rgba(0,0,0,0.5); padding: 12px; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  th, td { border: 1px solid var(--border); padding: 8px; text-align: left; }
  th { background: #16181f; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎬 <span>쇼핑 쇼츠 제작 스튜디오</span> (Vercel 배포판)</h1>
    <div style="font-size:13px; color:#20c997;">● 서버 연결됨</div>
  </header>

  <div class="layout">
    <div>
      <div class="card">
        <label>Google Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="AIzaSy... (입력 시 Vercel 서버가 실시간 호출)">
        <label>유튜브 원본 URL</label>
        <input type="text" id="videoUrl" value="https://www.youtube.com/watch?v=sample_son">
        <label>출연 연예인 (선택)</label>
        <input type="text" id="celebrity" value="손예진">
        <label>제품명 (선택)</label>
        <input type="text" id="productHint" value="프리지아 향수">
        <label>대본 힌트</label>
        <textarea id="transcript" rows="5">[02:15 ~ 02:18] 제가 10년째 안 알려준 비밀 향수예요.
[02:19 ~ 02:22] 스태프들도 매일 물어봤는데 절대 안 알려줬어요.
[02:22 ~ 02:25] 오늘 처음 공개해요.
[02:26 ~ 02:29] 산타마리아노벨라 프리지아 향수예요. 3병째 쓰고 있어요.</textarea>
        <button class="btn-submit" onclick="callServerAnalyze()">🚀 Vercel AI 서버로 분석하기</button>
      </div>
    </div>

    <div>
      <div style="display: grid; grid-template-columns: 320px 1fr; gap: 20px;">
        <div class="phone-mockup">
          <div class="phone-top">
            <div class="t1" id="mockTop1">10년째 비밀 유지</div><br>
            <div class="t2" id="mockTop2">손예진 원픽 향수</div>
          </div>
          <div class="phone-center">
            <div style="font-size:11px; background:#ff0050; display:inline-block; padding:2px 6px; border-radius:10px; margin-bottom:6px;" id="mockBadge">장면 1 (최강 훅)</div>
            <div style="font-size:13px; font-weight:bold;" id="mockText">"스태프들도 매일 뭐 뿌렸냐고 물어보는데 절대 안 알려줬어요."</div>
          </div>
          <div style="font-size:11px; color:#aaa;">⏱ 18.5초 (1.1x 배속)</div>
        </div>

        <div>
          <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
              <b style="font-size:16px;" id="resProduct">프리지아 오 드 코롱 (산타마리아노벨라)</b>
              <span style="background:#2b8a3e; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:bold;" id="resGrade">S (즉시 제작) · 96점</span>
            </div>
            <div style="font-size:13px; color:#74c0fc;" id="resType">주 유형: [A2] N병·N개 소진형</div>
            <div style="background:#2a2310; border-left:3px solid #fcc419; padding:8px 12px; margin-top:10px; font-size:12px; color:#ffe066;" id="resHook">
              💡 최강 훅: "제가 진짜 10년째 아무한테도 안 알려준 비밀 향수가 있거든요."
            </div>
          </div>

          <div class="card">
            <div style="margin-bottom:10px;">
              <button class="btn-tab active">💡 A안: 궁금증·반전형</button>
            </div>
            <div id="timelineContainer"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
async function callServerAnalyze() {
  const payload = {
    apiKey: document.getElementById('apiKey').value.trim(),
    videoUrl: document.getElementById('videoUrl').value.trim(),
    celebrity: document.getElementById('celebrity').value.trim(),
    productHint: document.getElementById('productHint').value.trim(),
    transcript: document.getElementById('transcript').value.trim()
  };

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    document.getElementById('mockTop1').innerText = data.top1;
    document.getElementById('mockTop2').innerText = data.top2;
    document.getElementById('resProduct').innerText = `${data.product} (${data.brand})`;
    document.getElementById('resGrade').innerText = `${data.grade} · ${data.score}점`;
    document.getElementById('resType').innerText = `주 유형: ${data.viralTypePrimary}`;
    document.getElementById('resHook').innerText = `💡 최강 훅: "${data.hookQuote}"`;

    let rows = '';
    data.scenes.forEach(s => {
      rows += `<tr><td><b>${s.scene}</b></td><td>${s.time}</td><td>${s.action}</td><td style="color:#ff8787;">${s.sfx}</td></tr>`;
    });
    document.getElementById('timelineContainer').innerHTML = `<table><thead><tr><th>장면</th><th>타임라인</th><th>대사 내용</th><th>효과음</th></tr></thead><tbody>${rows}</tbody></table>`;
  } catch (err) {
    alert("서버 통신 에러: " + err.message);
  }
}
window.onload = callServerAnalyze;
</script>
</body>
</html>
